// ============ Sigmoid & logit helpers ============
const sigmoid = x => 1 / (1 + Math.exp(-x));

function logitOrdPredict(params, xScaled) {
  const coefs = params.coefs;
  let eta = 0;
  for (let i = 0; i < coefs.length; i++) eta += coefs[i] * xScaled[i];
  const thresholds = params.thresholds;
  const K = thresholds.length + 1;
  const probs = new Array(K);
  let prev = 0;
  for (let k = 0; k < thresholds.length; k++) {
    const cum = sigmoid(thresholds[k] - eta);

    prev = cum;
  }
  probs[K-1] = 1 - prev;
  // asegurar no negativos
  for (let i = 0; i < K; i++) probs[i] = Math.max(1e-6, probs[i]);
  const s = probs.reduce((a,b)=>a+b,0);
  return probs.map(p => p/s);
}

function logitBinPredict(params, xScaled) {
  let eta = params.intercept;
  for (let i = 0; i < params.coefs.length; i++) eta += params.coefs[i] * xScaled[i];
  return sigmoid(eta);
}

function treePredict(tree, xScaled) {
  let node = 0;
  while (tree.children_left[node] !== -1) {
    const f = tree.feature[node];
    const t = tree.threshold[node];
    node = (xScaled[f] <= t) ? tree.children_left[node] : tree.children_right[node];
  }
  const v = tree.value[node][0];
  const s = v.reduce((a,b)=>a+b,0);
  return s > 0 ? v.map(x => x/s) : v.map(() => 1/v.length);
}

function ensemblePredict(logitProbs, treeProbs) {
  const K = Math.max(logitProbs.length, treeProbs.length);
  const out = new Array(K).fill(0);
  for (let i = 0; i < K; i++) {
    const lp = i < logitProbs.length ? logitProbs[i] : 0;
    const tp = i < treeProbs.length ? treeProbs[i] : 0;
    out[i] = 0.5 * lp + 0.5 * tp;
  }
  const s = out.reduce((a,b)=>a+b,0);
  return out.map(x => x/s);
}

function scaleX(values, means, stds) {
  return values.map((v, i) => (v - means[i]) / stds[i]);
}

function SeccionSimulador() {
  const sim = DATA.simulador;
  const feats = sim.features;
  const [values, setValues] = useState(() => feats.map((f,i) => {
    const m = FIELD_META[f];
    // redondear a int si la variable es claramente categórica/ordinal
    const mean = sim.feature_means[i];
    if (m && (m.type === "select" || m.type === "toggle")) return Math.round(mean);
    if (m && m.type === "number" && m.step === 1) return Math.round(mean);
    return Math.round(mean * 100) / 100;
  }));

  const result = useMemo(() => {
    const xs = scaleX(values, sim.feature_means, sim.feature_stds);
    // motivación (4 clases)
    const logitMot = logitOrdPredict(sim.logit_motivacion, xs);
    const treeMot = treePredict(sim.tree_motivacion, xs);
    const ensMot = ensemblePredict(logitMot, treeMot);
    // graduación (3)
    const logitGr = logitOrdPredict(sim.logit_graduacion, xs);
    const treeGr = treePredict(sim.tree_graduacion, xs);
    const ensGr = ensemblePredict(logitGr, treeGr);
    // abandono (binario)
    const logitAb = logitBinPredict(sim.logit_abandono, xs);
    const treeAbProbs = treePredict(sim.tree_abandono, xs);
    const treeAb = treeAbProbs.length === 2 ? treeAbProbs[1] : treeAbProbs[0];
    const ensAb = 0.5 * logitAb + 0.5 * treeAb;
    // incertidumbre: desviación absoluta entre motores (promedio)
    const uncMot = logitMot.reduce((a,v,i)=>a+Math.abs(v-treeMot[i]),0)/logitMot.length;
    const uncGr = logitGr.reduce((a,v,i)=>a+Math.abs(v-treeGr[i]),0)/logitGr.length;
    const uncAb = Math.abs(logitAb - treeAb);
    return {
      motivacion: {logit: logitMot, tree: treeMot, ensemble: ensMot, uncertainty: uncMot, levels: sim.niveles_motivacion},
      graduacion: {logit: logitGr, tree: treeGr, ensemble: ensGr, uncertainty: uncGr, levels: sim.niveles_graduacion},
      abandono:   {logit: logitAb, tree: treeAb, ensemble: ensAb, uncertainty: uncAb, levels: sim.niveles_abandono},
    };
  }, [values]);

  const motBars = result.motivacion.ensemble.map((p,i) => ({
    cat: result.motivacion.levels[String(i+1)] || `L${i+1}`,
    prob: p, logit: result.motivacion.logit[i], tree: result.motivacion.tree[i],
  }));
  const grBars = result.graduacion.ensemble.map((p,i) => ({
    cat: result.graduacion.levels[String(i+1)] || `L${i+1}`,
    prob: p, logit: result.graduacion.logit[i], tree: result.graduacion.tree[i],
  }));

  const abData = [
    {cat: "No riesgo", prob: 1 - result.abandono.ensemble},
    {cat: "Sí riesgo", prob: result.abandono.ensemble},
  ];

  const roundForFeat = (f, v) => {
    const m = FIELD_META[f];
    if (m && (m.type === "select" || m.type === "toggle")) return Math.round(v);
    if (m && m.type === "number" && m.step === 1) return Math.round(v);
    return Math.round(v * 100) / 100;
  };
  const resetValues = () => setValues(feats.map((f,i) => roundForFeat(f, sim.feature_means[i])));
  const setPreset = (preset) => {
    const presets = {
      medio: feats.map((f,i) => roundForFeat(f, sim.feature_means[i])),
      optimo: feats.map((f,i) => roundForFeat(f, sim.feature_ranges[f].p75)),
      riesgo: feats.map((f,i) => roundForFeat(f, sim.feature_ranges[f].p25)),
    };
    setValues(presets[preset]);
  };
  const updateValue = (idx, v) => {
    const nv = [...values]; nv[idx] = v; setValues(nv);
  };

  // Agrupar features por dimensión preservando orden del modelo
  const featsByDim = {};
  feats.forEach((f, i) => {
    const m = FIELD_META[f];
    const d = m ? m.dim : "otros";
    if (!featsByDim[d]) featsByDim[d] = [];
    featsByDim[d].push({feat: f, idx: i});
  });

  const topCat = (probs) => {
    let mx = 0, idx = 0;
    for (let i = 0; i < probs.length; i++) if (probs[i] > mx) { mx = probs[i]; idx = i; }
    return {idx, prob: mx};
  };
  const tMot = topCat(result.motivacion.ensemble);
  const tGr = topCat(result.graduacion.ensemble);

  return (
    <Section id="simulador" title="7. Simulador predictivo ensemble"
      subtitle="Configure los 15 predictores y observe las probabilidades simultáneas para los 3 targets">
      <Narrative>
        Motor: <b>Ensemble 50% Logit Ordinal + 50% Árbol Destilado</b> del ML sobresaliente por target (RF, XGB, XGB).
        Todas las predicciones se calculan <b>localmente en el navegador</b> sin enviar datos. El indicador de <b>incertidumbre</b>
         proviene de la desviación entre ambos motores.
      </Narrative>

      <div className="mb-4 flex flex-wrap gap-2 no-print">
        <button onClick={resetValues} className="px-3 py-1.5 rounded bg-slate-200 hover:bg-slate-300 text-sm font-semibold">↻ Valores promedio</button>
        <button onClick={() => setPreset('optimo')} className="px-3 py-1.5 rounded bg-emerald-100 hover:bg-emerald-200 text-sm text-emerald-800 font-semibold">● Perfil óptimo (P75)</button>
        <button onClick={() => setPreset('riesgo')} className="px-3 py-1.5 rounded bg-red-100 hover:bg-red-200 text-sm text-red-800 font-semibold">● Perfil riesgo (P25)</button>
      </div>

      <div className="grid lg:grid-cols-2 gap-6">
        {/* Controles agrupados por dimensión */}
        <div className="space-y-4 max-h-[700px] overflow-y-auto pr-2 no-print border border-slate-200 rounded-lg p-4 bg-white">
          <h3 className="font-bold text-slate-800 sticky top-0 bg-white pb-2 z-10 text-base border-b border-slate-300">
            Variables de entrada (15)
          </h3>
          {DIM_ORDER.filter(d => featsByDim[d] && featsByDim[d].length > 0).map((d, di) => {
            const dm = DIM_META[d];
            return (
              <div key={d} className={di>0 ? "pt-3 border-t border-slate-200" : ""}>
                <h4 className="font-bold uppercase tracking-wide text-xs mb-3 flex items-center gap-2" style={{color: dm.color}}>
                  <span>{dm.icon}</span><span>{dm.label}</span>
                </h4>
                <div className="space-y-3">
                  {featsByDim[d].map(({feat, idx}) => (
                    <FieldControl key={feat} feat={feat} meta={FIELD_META[feat]}
                      value={values[idx]} onChange={v => updateValue(idx, v)}/>
                  ))}
                </div>
              </div>
            );
          })}
          <div className="pt-3 border-t border-slate-200 text-[11px] text-slate-400">
            Variable interna (modelo): se conserva el nombre técnico para trazabilidad científica.
            Los valores se escalan con StandardScaler antes de alimentar al motor ensemble.
          </div>
        </div>

        {/* Resultados */}
        <div className="space-y-4">
          <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
            <div className="flex justify-between items-start mb-2">
              <h3 className="font-bold text-blue-900">Motivación (4 niveles ordinales)</h3>
              <span className="text-xs text-slate-500">Incertidumbre: {(result.motivacion.uncertainty*100).toFixed(1)}%</span>
            </div>
            <ResponsiveContainer width="100%" height={160}>
              <BarChart data={motBars}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0"/>
                <XAxis dataKey="cat" tick={{fontSize: 11}}/>
                <YAxis domain={[0, 1]} tickFormatter={v => (v*100).toFixed(0)+'%'}/>
                <Tooltip formatter={v => (v*100).toFixed(1)+'%'}/>
                <Bar dataKey="prob" fill={BRAND.blue} label={{position: 'top', fontSize: 10, formatter: v => (v*100).toFixed(0)+'%'}}/>
              </BarChart>
            </ResponsiveContainer>
            <div className="text-sm mt-2">Nivel más probable: <b>{motBars[tMot.idx].cat}</b> <span className="text-blue-700">({(tMot.prob*100).toFixed(1)}%)</span></div>
          </div>

          <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-4">
            <div className="flex justify-between items-start mb-2">
              <h3 className="font-bold text-emerald-900">Graduación (3 niveles ordinales)</h3>
              <span className="text-xs text-slate-500">Incertidumbre: {(result.graduacion.uncertainty*100).toFixed(1)}%</span>
            </div>
            <ResponsiveContainer width="100%" height={160}>
              <BarChart data={grBars}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0"/>
                <XAxis dataKey="cat" tick={{fontSize: 11}}/>
                <YAxis domain={[0, 1]} tickFormatter={v => (v*100).toFixed(0)+'%'}/>
                <Tooltip formatter={v => (v*100).toFixed(1)+'%'}/>
                <Bar dataKey="prob" fill={BRAND.emerald} label={{position: 'top', fontSize: 10, formatter: v => (v*100).toFixed(0)+'%'}}/>
              </BarChart>
            </ResponsiveContainer>
            <div className="text-sm mt-2">Nivel más probable: <b>{grBars[tGr.idx].cat}</b> <span className="text-emerald-700">({(tGr.prob*100).toFixed(1)}%)</span></div>
          </div>

          <div className="bg-red-50 border border-red-200 rounded-lg p-4">
            <div className="flex justify-between items-start mb-2">
              <h3 className="font-bold text-red-900">Riesgo de abandono (binario)</h3>
              <span className="text-xs text-slate-500">Incertidumbre: {(result.abandono.uncertainty*100).toFixed(1)}%</span>
            </div>
            <ResponsiveContainer width="100%" height={130}>
              <BarChart data={abData}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0"/>
                <XAxis dataKey="cat" tick={{fontSize: 11}}/>
                <YAxis domain={[0, 1]} tickFormatter={v => (v*100).toFixed(0)+'%'}/>
                <Tooltip formatter={v => (v*100).toFixed(1)+'%'}/>
                <Bar dataKey="prob" label={{position: 'top', fontSize: 11, formatter: v => (v*100).toFixed(1)+'%'}}>
                  <Cell fill={BRAND.emerald}/>
                  <Cell fill={BRAND.red}/>
                </Bar>
              </BarChart>
            </ResponsiveContainer>
            <div className="text-sm mt-2">Probabilidad de abandono: <b className="text-red-700">{(result.abandono.ensemble*100).toFixed(1)}%</b>
              {result.abandono.ensemble >= 0.5 ? <span className="ml-2 inline-block px-2 py-0.5 bg-red-600 text-white rounded text-xs">ALERTA</span>
                                               : <span className="ml-2 inline-block px-2 py-0.5 bg-emerald-600 text-white rounded text-xs">BAJO</span>}
            </div>
          </div>
        </div>
      </div>
    </Section>
  );
}
